hetzner {
  # No default: a missing token must fail config loading rather than send
  # requests with a placeholder credential.
  token = ${?HCLOUD_TOKEN}

  base-url = "https://api.hetzner.cloud/v1"
  base-url = ${?HCLOUD_BASE_URL}

  request-timeout = 30s

  retry {
    max-attempts = 5
    initial-backoff = 500ms
    max-backoff = 30s
  }

  action-poll {
    interval = 2s
    max-interval = 10s
    timeout = 5m
  }
}
